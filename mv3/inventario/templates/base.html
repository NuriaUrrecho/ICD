<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventario CPD{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('web.index') }}">NODO<span>03</span></a><span class="navbar-text">Inventario de infraestructura</span></div>
  </nav>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="container mt-3">{% for category, message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  <footer class="container py-4 text-secondary small">Práctica 4 · UPV · MV3 Flask + MariaDB</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
